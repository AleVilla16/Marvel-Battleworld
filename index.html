<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marvel Battleworld</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: dark sticky app bar (menu, wordmark, search), full-screen menu with red chevrons, slanted red buttons,
   5:7 card tiles in a grid, full-screen sheets for card detail, search/filters and forms. */
:root{
  --bg:#151515; --bar:#262626; --surface:#1e1e1e; --raise:#2e2e2e; --line:#3c3c3c;
  --fg:#f5f5f5; --muted:#adadad; --red:#e0352e; --red-text:#ff5f58;
  --cosmici:#7b6cff; --mistici:#c04fe0; --mutanti:#f3b61f; --scientifici:#33b96f; --talent:#f27a1f; --tech:#27aad6;
  --r-comune:#9aa1a8; --r-noncomune:#4cc16f; --r-raro:#3d8bff; --r-epico:#a855f7; --r-leggendario:#f59e0b; --r-mitico:#ef3f6d;
  --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f1f1ee; --bar:#ffffff; --surface:#ffffff; --raise:#e7e7e3; --line:#d2d2cc;
  --fg:#161616; --muted:#5b5b5b; --red:#d42a23; --red-text:#c0221c;
  --cosmici:#5a49e6; --mistici:#a634c6; --mutanti:#d99a00; --scientifici:#1f9a55; --talent:#d9640a; --tech:#1389b4;
  --r-comune:#6f777e; --r-noncomune:#2f9e51; --r-raro:#2469d8; --r-epico:#8b3fe0; --r-leggendario:#c47a00; --r-mitico:#d02556;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 17px/1.45 var(--font-body);letter-spacing:.02em;-webkit-text-size-adjust:100%;min-height:100%}
button{font:inherit;color:inherit}
h1,h2,h3,p,ul,dl,dd{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
:focus-visible{outline:2px solid var(--red-text);outline-offset:2px}

/* app bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--line)}
.top-in{height:56px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.ib{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;cursor:pointer;color:var(--fg);padding:0}
.ib svg{width:26px;height:26px}
.mark{justify-self:center;align-self:stretch;border:0;cursor:pointer;background:var(--red);color:#fff;font:800 27px/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase;padding:0 14px;display:flex;align-items:center}

/* menu & sheets */
.menu,.sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.menu{z-index:50;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{z-index:60}
.menu.open,.sheet.open{display:flex}
.menu-x{height:64px;display:flex;align-items:center;flex:none}
.nav{display:flex;flex-direction:column}
.nav-row{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:0;cursor:pointer;text-align:left;
  font:700 27px/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase;padding:21px 0;color:var(--fg)}
.nav-row.on{color:var(--red-text)}
.chev{width:22px;height:22px;color:var(--red-text);transition:transform .2s;flex:none}
.nav-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sub{display:none;flex-direction:column;padding:0 0 14px 14px}
.sub.open{display:flex}
.sub button{background:none;border:0;text-align:left;cursor:pointer;color:var(--muted);font:600 21px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;padding:13px 0;display:flex;align-items:center;gap:10px}
.menu-ft{margin-top:auto;border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:15px}
.sheet-hd{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.sheet-hd .gut{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.sheet-hd h2{font:700 24px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-bd{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:20px 28px}
.sheet-ft{flex:none;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-ft .gut{display:flex;gap:10px;padding-block:12px;justify-content:flex-end;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;background:var(--red);color:#fff;font:700 18px/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase;padding:15px 30px;transform:skewX(-14deg);margin:0 7px}
.btn>span{display:inline-block;transform:skewX(14deg)}
.btn.alt{background:var(--raise);color:var(--fg)}
.btn.sm{padding:11px 20px;font-size:16px}
.btn.danger{background:#a11d18;color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:12px 6px;align-items:center}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--red-text);font:700 16px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase}

/* type */
.eyebrow{font:700 15px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--red-text)}
.page-hd{padding-top:26px;display:flex;flex-direction:column;gap:14px}
.clink{display:inline-flex;align-items:center;gap:8px;max-width:100%;color:var(--red-text);font-weight:600;text-decoration:none;border:1px solid var(--line);padding:8px 12px;background:var(--surface)}
.clink:hover{border-color:var(--red-text)}
.clink svg{width:18px;height:18px;flex:none}
.clink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icbtn{width:52px;height:52px;border:1px solid var(--line);background:var(--raise);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s,color .15s,border-color .15s}
.icbtn svg{width:26px;height:26px}
.icbtn:hover{background:var(--red);border-color:var(--red);color:#fff}
.icbtn.del:hover{background:#a11d18;border-color:#a11d18}
.cf-q{font:600 15px/1 var(--font-body);color:var(--muted);margin-right:4px;white-space:nowrap}
.cf-b{border:0;cursor:pointer;background:var(--raise);color:var(--fg);font:700 14px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;padding:10px 12px}
.cf-b.yes{background:#a11d18;color:#fff}
#sh-detail .sheet-hd h2{flex:1}
#sh-detail.confirming #dt-fav,#sh-detail.confirming #dt-pr{display:none}
.prbtn[aria-pressed="true"]{background:var(--red);color:#fff}
.prbtn svg{width:24px;height:24px}
@media (max-width:480px){.cf-q{display:none}#sh-detail.confirming #dt-title{visibility:hidden}}
#sh-detail .ib svg{width:24px;height:24px}
.zoomart{display:block;width:100%;border:0;padding:0;background:none;cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));cursor:zoom-out}
.zoom.open{display:flex}
.zoom-x{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;color:#fff;z-index:2}
.zoom-in{height:min(100%,calc((100vw - 32px) * 7 / 5));aspect-ratio:5/7;max-width:100%}
.zoom-in .art{width:100%;height:100%;max-width:none;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.zoom-in .f-code,.zoom-in .f-num{display:none}
.rsecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;margin-top:26px}
.rsec{display:flex;align-items:center;min-height:68px;gap:14px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);padding:16px 16px 16px 18px;color:var(--fg);font:inherit;transition:border-color .15s,transform .15s,background .15s}
.rsec:hover{border-color:var(--red);transform:translateY(-2px)}
.rsec-n{font:800 28px/1 var(--font-display);color:var(--red-text);letter-spacing:.02em;align-self:flex-start;min-width:34px}
.rsec-tx{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.rsec-t{font:800 22px/1.05 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.rsec-s{color:var(--muted);font-size:16px;line-height:1.35}
.rsec-f{font:700 13px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--red-text);margin-top:3px}
.rsec-go{width:22px;height:22px;flex:none;align-self:center;color:var(--muted)}
.rs-add{grid-column:1/-1;margin-top:2px}
.ru-sum{font-size:19px;line-height:1.4;color:var(--muted);max-width:60ch}
.ru-dots{display:flex;align-items:center;margin:22px 0 6px;flex-wrap:wrap;row-gap:8px}
.ru-dots i{flex:1;min-width:10px;max-width:60px;height:2px;background:var(--line)}
.ru-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;font:700 15px/1 var(--font-display);padding:0;flex:none}
.ru-dot.done{border-color:var(--red);color:var(--red-text)}
.ru-dot.on{background:var(--red);border-color:var(--red);color:#fff}
.ru-step{margin-top:22px;background:var(--surface);border:1px solid var(--line);padding:22px 22px 24px;max-width:760px}
.ru-k{font:700 13px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--red-text)}
.ru-step h3{font:800 30px/1.05 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.ru-step .prose{padding-top:14px;font-size:18px}
.ru-ft{flex:1;display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
.ru-step-ed{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.ru-step-hd{display:flex;align-items:center;gap:6px;font:700 16px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase}
.rs-pen{flex:none;opacity:.7}
.rs-pen:hover{opacity:1}
.rs-pen svg{width:20px;height:20px}
.faq{margin-top:44px;max-width:820px}
.faq-t{font:800 34px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.faq>.muted{margin-top:6px}
.faq-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.faq-it{background:var(--surface);border:1px solid var(--line)}
.faq-it.editing{padding:16px}
.faq-it summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 18px;font:700 19px/1.25 var(--font-display);letter-spacing:.03em}
.faq-it summary::-webkit-details-marker{display:none}
.faq-it summary span{flex:1}
.faq-chev{width:20px;height:20px;flex:none;color:var(--red-text);transition:transform .2s}
.faq-it[open] .faq-chev{transform:rotate(180deg)}
.faq-it[open] summary{border-bottom:1px solid var(--line)}
.faq-a{display:flex;gap:10px;align-items:flex-start;padding:12px 18px 14px}
.faq-a .prose{flex:1;padding-top:0;max-width:none}
.pr-go{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px 0 8px;text-align:center}
.pr-btn{display:inline-flex;align-items:center;gap:14px;border:0;cursor:pointer;background:var(--red);color:#fff;padding:16px 34px 16px 26px;font:800 26px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;transform:skewX(-14deg);box-shadow:0 12px 26px -10px rgba(224,53,46,.8);transition:filter .15s,transform .15s}
.pr-btn>*{transform:skewX(14deg)}
.pr-btn svg{width:38px;height:38px}
.pr-btn:hover:not(:disabled){filter:brightness(1.08)}
.pr-btn:disabled{background:var(--raise);color:var(--muted);box-shadow:none;cursor:not-allowed}
.pr-sec{margin-top:34px;max-width:900px}
.pr-sec h2{display:flex;align-items:center;gap:12px;font:800 28px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px}
.pr-sec h2 span{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:18px}
.pr-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pr-tools input{flex:1;min-width:200px}
.pr-count{margin:12px 0 8px;font:700 15px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--red-text)}
.pr-list{max-height:380px;overflow:auto;border:1px solid var(--line);background:var(--surface)}
.pr-row{display:grid;grid-template-columns:auto 110px 1fr auto;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.pr-row:last-child{border-bottom:0}
.pr-row:hover{background:var(--raise)}
.pr-row input{width:20px;height:20px;accent-color:var(--red)}
.pr-row b{font:700 16px/1 var(--font-display);letter-spacing:.04em}
.pr-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-row i{font:600 12px/1 var(--font-display);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){.pr-row{grid-template-columns:auto 84px 1fr}.pr-row i{display:none}}
.pr-note{margin-top:16px}
.pr-note-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.pr-note textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:120px}
.pr-up{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.pr-stat{margin-top:12px}
.pr-save{margin-top:18px;border:1px solid var(--line);border-left:4px solid var(--red);background:var(--surface);padding:14px 16px}
.pr-save b{font:700 18px/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.pr-save p.muted{margin-top:4px}
.pr-stat .bad,.pr-miss{color:var(--red-text)}
.pr-miss{font-size:14px;margin-top:6px}
.pr-retro{display:flex;gap:16px;align-items:center;margin-top:20px;border:1px solid var(--line);background:var(--surface);padding:14px}
.pr-retro-prev{width:68px;aspect-ratio:68/95;flex:none;background:var(--raise);display:grid;place-items:center;overflow:hidden;border-radius:4px}
.pr-retro-prev img{width:100%;height:100%;object-fit:cover}
.pr-retro-prev span{font:700 12px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pr-retro b{font:700 18px/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.xi{margin-top:16px;border:1px solid var(--line);border-left:4px solid var(--red);background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.xi-sum{display:flex;flex-direction:column;gap:4px;padding-left:18px}
.xi-list{max-height:260px;overflow:auto;border-top:1px solid var(--line);padding:10px 0 0 18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.af-top{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.af-logo{width:min(160px,40vw);aspect-ratio:1;flex:none;display:grid;place-items:center;overflow:hidden}
.af-logo .aff.lg{object-fit:contain}
.af-logo .aff-ph{font-size:48px}
.af-info{flex:1;min-width:220px}
.af-ab{font:800 28px/1.05 var(--font-display);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 10px}
.afd{margin-top:12px;border-left:3px solid var(--red);padding:2px 0 2px 12px}
.afd>b{font:700 17px/1.2 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.afd .prose{padding-top:4px;font-size:16px}
.pdf-card{margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);padding:18px 20px;max-width:640px}
.pdf-ic{width:54px;height:66px;flex:none;background:#e0352e;color:#fff;display:grid;place-items:center;font:800 15px/1 var(--font-display);letter-spacing:.08em;clip-path:polygon(0 0,72% 0,100% 22%,100% 100%,0 100%)}
.pdf-meta{flex:1;min-width:160px}
.pdf-meta b{display:block;font:700 19px/1.25 var(--font-display);letter-spacing:.04em;word-break:break-word}
.pdf-meta span{color:var(--muted);font-size:14px}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.addbtn{width:52px;height:52px;flex:none;margin-right:7px;border:0;cursor:pointer;background:var(--red);color:#fff;display:grid;place-items:center;transform:skewX(-14deg);transition:filter .15s,transform .15s}
.addbtn svg{width:28px;height:28px;transform:skewX(14deg)}
.addbtn:hover{filter:brightness(1.1)}
.addbtn:active{transform:skewX(-14deg) scale(.94)}
.page-hd h1{font:800 clamp(40px,11vw,60px)/.95 var(--font-display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.count{color:var(--muted);font-size:16px}
.lbl{font:700 14px/1.2 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--red-text);margin-bottom:10px}
.sec{padding-top:34px}
.sec h2{font:700 28px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
.muted{color:var(--muted)}
.note{background:var(--surface);border:1px solid var(--line);padding:16px;color:var(--muted)}
.note b{color:var(--fg)}

/* hero */
.hero{padding-block:34px 8px}
.hero h1{display:inline-block;background:var(--red);color:#fff;transform:skewX(-9deg);padding:.08em .3em .02em;margin:14px 0 18px;font:800 clamp(44px,13vw,76px)/.98 var(--font-display);letter-spacing:.02em;text-transform:uppercase}
.hero h1 span{display:inline-block;transform:skewX(9deg)}
.hero p{font-size:19px;max-width:34ch;color:var(--muted);margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:30px}
.stat{padding:16px 0;display:flex;flex-direction:column;gap:4px}
.stat+.stat{padding-left:16px;border-left:1px solid var(--line)}
.stat b{font:800 42px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font:600 14px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* class tiles */
.cls-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cls-tile{cursor:pointer;border:0;text-align:left;padding:16px 14px;min-height:88px;background:var(--cc);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.set-hd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:800 26px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid var(--red);padding:18px 0 8px;margin:0}
.set-hd:first-child{padding-top:4px}
.set-hd span{font:600 15px/1 var(--font-display);letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.set-tile{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:16px 14px;min-height:96px;display:flex;flex-direction:column;gap:6px}
.set-tile b{font:800 26px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--red-text)}
.set-tile span{font:600 17px/1.15 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.set-tile i{font:600 14px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-style:normal;margin-top:auto}
.cls-tile b{font:800 26px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.cls-tile span{font:600 15px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.rail .tile{flex:0 0 138px;scroll-snap-align:start}
.rail{gap:10px}

/* cards grid + tile */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,158px),1fr));gap:14px;padding-top:22px}
.tile{display:flex;flex-direction:column;gap:7px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.art{position:relative;aspect-ratio:5/7;max-width:100%;background:var(--raise);overflow:hidden;border-radius:6px;container-type:inline-size}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:7cqw;color:#fff;
  background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.14) 1px,transparent 1.6px) 0 0/7px 7px,linear-gradient(165deg,color-mix(in srgb,var(--cc,#777) 88%,#000) 0%,color-mix(in srgb,var(--cc,#777) 38%,#0d0d0d) 100%)}
.f-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.f-cost{min-width:15cqw;height:15cqw;border-radius:50%;background:#fff;color:#151515;font:800 9cqw/15cqw var(--font-display);text-align:center}
.f-cost:empty{visibility:hidden}
.f-type{font:700 6.4cqw/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;opacity:.95;padding-top:2cqw;display:flex;align-items:center;gap:2cqw}
.ci{width:1.2em;height:1.2em;flex:none}
.ci.fi{width:9cqw;height:9cqw}
.ci.big{width:34px;height:34px}
.cl-hd h2{display:flex;align-items:center;gap:12px}
.ci.hd{width:.9em;height:.9em}
.f-ini{font:800 38cqw/1 var(--font-display);text-align:center;opacity:.9;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.f-name{font:800 9.5cqw/1 var(--font-display);text-transform:uppercase;letter-spacing:.04em}
.f-sub{font:500 6.6cqw/1.1 var(--font-body);opacity:.9;min-height:1em}
.art.mini .f-type,.art.mini .f-name,.art.mini .f-sub,.art.mini .f-cost{display:none}
.t-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font:600 14px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase}
.rar{width:10px;height:10px;background:var(--rc);transform:rotate(45deg);flex:none}
.t-name{font:700 21px/1.05 var(--font-display);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.t-sub{color:var(--muted);font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.t-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;border-top:1px solid var(--line);padding-top:7px;margin-top:2px}
.t-stats span{display:flex;flex-direction:column;align-items:center;gap:2px}
.t-stats b{font:700 18px/1 var(--font-display);font-variant-numeric:tabular-nums}
.t-stats i{font:600 10px/1 var(--font-display);letter-spacing:.12em;color:var(--muted);font-style:normal}
.ex{font:600 11px/1 var(--font-display);letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);padding:2px 4px;margin-left:6px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 16px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;padding:10px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.static{cursor:default}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cc);flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.rdot{width:9px;height:9px;background:var(--rc);transform:rotate(45deg);flex:none}
.chip .x{font-size:18px;line-height:1;margin-left:2px}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{background:var(--surface);border:0;padding:10px 14px;cursor:pointer;font:600 16px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}

/* forms */
label.fl{display:flex;flex-direction:column;gap:6px;min-width:0}
label.fl>span,.fl-t{font:700 14px/1.2 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:500 17px/1.3 var(--font-body);letter-spacing:.02em;color:var(--fg);background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:0;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
.form{display:flex;flex-direction:column;gap:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px}
.fgrp{display:flex;flex-direction:column;gap:8px}
.rng{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.rng span{font:600 16px/1.1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.pick-img{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pick-img .art{width:120px}
.pick-img .col{display:flex;flex-direction:column;gap:10px;min-width:0}

/* detail */
.d-top{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:640px){.d-top{grid-template-columns:1fr}.d-top .art{max-width:320px}}
.d-name{font:800 clamp(34px,9vw,48px)/.98 var(--font-display);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.d-sub{font:600 22px/1.15 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.quote{font-style:italic;color:var(--muted);margin-top:14px;padding-left:14px;border-left:2px solid var(--line)}
.d-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:0;border:1px solid var(--line)}
.sg{padding:12px 10px;display:flex;flex-direction:column;gap:5px;background:var(--surface)}
.sg+.sg{border-left:1px solid var(--line)}
.sg i{font:600 12px/1.15 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-style:normal;min-height:2.3em}
.sg b{font:800 36px/1 var(--font-display);font-variant-numeric:tabular-nums}
.move{background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
.move h3{font:700 22px/1.1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.move .k{font:700 13px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--red-text)}
.move p{white-space:pre-wrap;overflow-wrap:anywhere}
.deckadd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}

/* decks */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:22px}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);min-width:0}
.item>button.open{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;text-align:left;cursor:pointer;padding:0}
.item .art{width:52px;flex:none;border-radius:4px}
.item .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.item .tx b{font:700 21px/1.05 var(--font-display);letter-spacing:.05em;text-transform:uppercase;overflow-wrap:anywhere}
.item .tx span{color:var(--muted);font-size:15px}
.bar{display:flex;height:6px;background:var(--raise);margin-top:6px;max-width:260px}
.bar i{display:block;height:100%;background:var(--cc)}
.qty{display:flex;align-items:center;gap:0;flex:none}
.qty button{width:40px;height:40px;background:var(--raise);border:0;cursor:pointer;font:700 22px/1 var(--font-display)}
.qty span{min-width:34px;text-align:center;font:800 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
.grp{font:700 15px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:22px 0 8px}
.back{margin-bottom:4px}
.namein{font:800 clamp(30px,8vw,44px)/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase;padding:8px 10px}

/* rules */
.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch;padding-top:22px}
.prose h2{font:800 32px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;margin-top:18px}
.prose h3{font:700 24px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;margin-top:8px;color:var(--red-text)}
.prose ul{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.prose p{overflow-wrap:anywhere}

/* classes view */
.cl{margin-top:18px}
.cl-hd{background:var(--cc);color:var(--ink);padding:18px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cl-hd h2{font:800 clamp(34px,9vw,48px)/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.cl-hd span{font:700 20px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase}
.cl-bd{background:var(--surface);border:1px solid var(--line);border-top:0;padding:16px;display:flex;flex-direction:column;gap:16px}

/* settings */
.set{display:flex;flex-direction:column;gap:12px;padding-top:30px}
.set h2{font:700 26px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.set p{color:var(--muted);max-width:60ch}
textarea.mono{font:500 14px/1.35 ui-monospace,Menlo,Consolas,monospace;min-height:150px}

.empty{padding-block:34px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty h2{font:800 30px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.empty p{color:var(--muted);max-width:44ch}
#toast{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;justify-content:center;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
#toast div{background:var(--fg);color:var(--bg);font:600 18px/1.2 var(--font-display);letter-spacing:.06em;text-transform:uppercase;padding:13px 18px;max-width:100%}
.fab{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.fab svg{width:28px;height:28px}
.navarr{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:40px;height:72px;border:0;cursor:pointer;display:grid;place-items:center;background:rgba(20,20,20,.5);color:#fff;opacity:.6;padding:0}
.navarr:hover,.navarr:focus-visible{opacity:.95}
.navarr svg{width:24px;height:24px}
.navarr.prev{left:env(safe-area-inset-left,0px);border-radius:0 8px 8px 0}
.navarr.next{right:env(safe-area-inset-right,0px);border-radius:8px 0 0 8px}
.navarr[hidden]{display:none!important}
body:not([data-view="carte"]) .fab{display:none}
body:not([data-view="carte"]) .top .ib[data-act="search"]{visibility:hidden}
.warn{position:absolute;left:2.5cqw;top:2.5cqw;width:15cqw;height:15cqw;z-index:3;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));pointer-events:none}
.warn svg{width:100%;height:100%;display:block}
.f-num{position:absolute;right:3cqw;bottom:3cqw;z-index:3;background:rgba(0,0,0,.72);color:#fff;font:700 6.4cqw/1 var(--font-display);letter-spacing:.06em;padding:1.6cqw 2.6cqw;border-radius:2cqw;pointer-events:none}
.f-code{position:absolute;left:3cqw;bottom:3cqw;z-index:3;background:rgba(0,0,0,.72);color:#fff;font:700 6.4cqw/1 var(--font-display);letter-spacing:.06em;padding:1.6cqw 2.6cqw;border-radius:2cqw;pointer-events:none;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art.mini .f-num,.art.mini .f-code{display:none}
.f-pr{position:absolute;left:3cqw;top:16cqw;z-index:3;width:13cqw;height:13cqw;padding:2cqw;border-radius:50%;background:var(--red);color:#fff;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.6);display:grid;place-items:center}
.f-pr svg{width:100%;height:100%}
.art.mini .f-pr{display:none}
.f-fav{position:absolute;right:3cqw;top:16cqw;z-index:3;width:13cqw;height:13cqw;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.f-fav svg,.favbtn svg{width:100%;height:100%;display:block;fill:#f5b301;stroke:#161616;stroke-width:1.2;stroke-linejoin:round}
.art.mini .f-fav{top:auto;bottom:4cqw;right:4cqw;width:30cqw;height:30cqw}
.sheet-hd .favbtn svg{width:26px;height:26px}
.favbtn[aria-pressed="false"] svg{fill:none;stroke:currentColor;stroke-width:1.8}
.pl-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pl-pick button{background:var(--surface);border:1px solid var(--line);cursor:pointer;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg)}
.pl-pick button b{font:800 44px/1 var(--font-display)}
.pl-pick button span{font:600 14px/1.2 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.pl-pick button:hover{border-color:var(--red)}
#sh-game{background-color:#05060f;background-image:
  radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 27% 72%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 41% 33%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 58% 84%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 66% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 79% 56%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 91% 27%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 6% 91%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 48% 6%,#cfe0ff 50%,transparent 51%),
  radial-gradient(1px 1px at 86% 88%,#ffe9c9 50%,transparent 51%),radial-gradient(1.5px 1.5px at 19% 47%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 72% 38%,#fff 50%,transparent 51%),
  radial-gradient(ellipse 55% 40% at 18% 25%,rgba(110,70,220,.30),transparent 70%),radial-gradient(ellipse 50% 45% at 85% 75%,rgba(30,120,210,.28),transparent 70%),
  radial-gradient(ellipse 40% 30% at 60% 45%,rgba(200,40,110,.14),transparent 70%),linear-gradient(180deg,#070818,#0b0a1f 55%,#05060f)}

  background-size:220px 220px}
#sh-game::after{background-image:radial-gradient(2.5px 2.5px at 285px 293px,#fff 50%,transparent 100%),radial-gradient(2.3px 2.3px at 174px 179px,rgba(255,236,210,.95) 50%,transparent 100%),radial-gradient(2.6px 2.6px at 233px 35px,#fff 50%,transparent 100%),radial-gradient(1.7px 1.7px at 242px 340px,#fff 50%,transparent 100%),radial-gradient(2.8px 2.8px at 331px 295px,rgba(200,220,255,.95) 50%,transparent 100%),radial-gradient(2.7px 2.7px at 145px 197px,#fff 50%,transparent 100%),radial-gradient(2.0px 2.0px at 11px 236px,rgba(255,236,210,.95) 50%,transparent 100%),radial-gradient(1.7px 1.7px at 59px 252px,#fff 50%,transparent 100%),radial-gradient(2.1px 2.1px at 66px 126px,rgba(200,220,255,.95) 50%,transparent 100%),radial-gradient(2.1px 2.1px at 41px 85px,rgba(255,236,210,.95) 50%,transparent 100%),radial-gradient(2.6px 2.6px at 142px 70px,rgba(255,236,210,.95) 50%,transparent 100%),radial-gradient(2.8px 2.8px at 142px 212px,rgba(200,220,255,.95) 50%,transparent 100%),radial-gradient(1.7px 1.7px at 118px 77px,#fff 50%,transparent 100%),radial-gradient(1.9px 1.9px at 118px 337px,rgba(200,220,255,.95) 50%,transparent 100%),radial-gradient(1.9px 1.9px at 301px 93px,#fff 50%,transparent 100%),radial-gradient(2.2px 2.2px at 74px 214px,rgba(255,236,210,.95) 50%,transparent 100%);background-size:340px 340px;background-position:60px 90px;opacity:.7;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.85}}
@media (prefers-reduced-motion:reduce){#sh-game::after{animation:none}}
#sh-game>*{position:relative;z-index:1}
#sh-game .sheet-hd,#sh-game .sheet-ft{background:rgba(10,10,24,.72);border-color:rgba(255,255,255,.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#sh-game .pl,#sh-game .pl-pick button{background:rgba(14,14,32,.34);border-color:rgba(255,255,255,.14)}
#sh-game .pl{border-top-color:var(--pc)}
#sh-game .pl.win{border-color:#f5b301}
#sh-game .pl-name{color:#fff;border-bottom-color:rgba(255,255,255,.15)}
#sh-game .pm{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
#sh-game .orb{box-shadow:0 0 0 3px rgba(10,10,24,.9),0 0 0 5px var(--oc),0 0 22px -2px var(--oc)}
#sh-game .gm-info,#sh-game .lbl,#sh-game .muted{color:rgba(255,255,255,.72)}
#sh-game .gm-info b,#sh-game h2,#sh-game .pl-pick b{color:#fff}
#sh-game .pl-pick span{color:rgba(255,255,255,.7)}
#sh-game .vita .lbl{color:#4fe08f}
#sh-game .glo .lbl{color:#ff6b62}
#sh-game.playing .sheet-bd{overflow:hidden;padding-block:8px}
#sh-game.playing #gm-body{max-width:none;height:100%}
.players{display:grid;gap:8px;height:100%;--o:80px}
.players.nolbl .ctr .lbl{display:none}
.players.stack .ctrs{flex-direction:column;justify-content:space-evenly;gap:6px}
.pl{container-type:size;min-width:0;min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.pl.out{opacity:.55}
.pl.win{border-color:#f5b301;box-shadow:0 0 0 2px #f5b301 inset}
.pl-hd{display:flex;align-items:center;gap:8px;flex:none}
.pl-name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:700 clamp(14px,min(9cqh,6cqw),26px)/1.2 var(--font-display);letter-spacing:.06em;text-transform:uppercase;padding:2px 0}
.pl-st{font:700 clamp(11px,min(6cqh,3.6cqw),16px)/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.pl-st:empty{display:none}
.ctrs{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-around;gap:2cqw}
.ctr{display:flex;flex-direction:column;align-items:center;gap:calc(var(--o)*.07)}
.ctr .lbl{margin:0;text-align:center;font-size:max(10px,calc(var(--o)*.13));white-space:nowrap}
.vita .lbl{color:#4fe08f}
.glo .lbl{color:#ff5f58}
.ctr-row{display:flex;align-items:center;justify-content:center;gap:max(4px,calc(var(--o)*.08))}
.pm{width:max(28px,calc(var(--o)*.4));height:max(28px,calc(var(--o)*.4));border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0;flex:none;transition:background .12s,transform .08s}
.pm svg{width:50%;height:50%}
.pm:active{transform:scale(.92)}
.vita .pm:hover{background:#1fa463;border-color:#1fa463;color:#fff}

<script>
(() => {
'use strict';

/* ---------- costanti ---------- */
const TIPI = ['Personaggio','Oggetto','Alleanza','Luogo','Fumetto'];
const TIPI_PL = {Personaggio:'Personaggi',Oggetto:'Oggetti',Alleanza:'Alleanze',Luogo:'Luoghi',Fumetto:'Fumetti'};
const CLASSI = ['Cosmici','Mistici','Mutanti','Scientifici','Talent','Tech'];
const CLASS_VAR = {Cosmici:'--cosmici',Mistici:'--mistici',Mutanti:'--mutanti',Scientifici:'--scientifici',Talent:'--talent',Tech:'--tech'};
const CLASS_INK = {Cosmici:'#ffffff',Mistici:'#ffffff',Mutanti:'#161616',Scientifici:'#06210f',Talent:'#1d0f00',Tech:'#04222c'};
const CLASS_ICON = {
  Cosmici: '<path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.7-6-3.4-6 3.4 1.3-6.7-5-4.7 6.8-.8z"/>',
  Mistici: '<path d="M20 14.6A8.6 8.6 0 0 1 9.4 4a8.6 8.6 0 1 0 10.6 10.6z"/><path d="M17 4v4M15 6h4"/>',
  Mutanti: '<path d="M7 3c0 5 10 5 10 9s-10 4-10 9"/><path d="M17 3c0 5-10 5-10 9s10 4 10 9"/><path d="M9 7h6M8.5 12h7M9 17h6"/>',
  Scientifici: '<path d="M9 3h6M10 3v6l-5.6 9.6A2 2 0 0 0 6.1 21.5h11.8a2 2 0 0 0 1.7-2.9L14 9V3"/><path d="M7.5 15h9"/>',
  Talent: '<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/>',
  Tech: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.8"/><path d="M12 2v3.2M12 18.8V22M2 12h3.2M18.8 12H22M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2"/>'
};

/* ---------- icone personalizzate (classi, rarità, affiliazioni, simboli) ---------- */
let ICONS = {};
const SYM_BASE = ['F','P','D','R','G','E','D6','D8','D10'];
const SYM_HINT = {F:'Forza',P:'Potere',D:'Danno',R:'Resistenza',G:'Gloria',D6:'Dado a 6 facce',D8:'Dado a 8 facce',D10:'Dado a 10 facce'};
const affList = d => { const a = Array.isArray(d.affiliazioni) ? d.affiliazioni : (d.affiliazione ? String(d.affiliazione).split(/\s*[,;]\s*/) : []); return [...new Set(a.map(x => String(x || '').trim()).filter(Boolean))]; };
const ICON_KINDS = {classe:'Classi', rarita:'Rarità', affiliazione:'Affiliazioni', simbolo:'Simboli nel testo'};
const icoKey = (k, n) => k + '|' + n;
const icoGet = (k, n) => ICONS[icoKey(k, n)] || null;
const icoNames = k => Object.values(ICONS).filter(i => i.kind === k).map(i => i.name);
const classi = () => [...CLASSI, ...icoNames('classe').filter(n => !CLASSI.includes(n)).sort((a, b) => a.localeCompare(b, 'it'))];
const rarita = () => [...RARITA, ...icoNames('rarita').filter(n => !RARITA.includes(n)).sort((a, b) => a.localeCompare(b, 'it'))];
const symList = () => [...SYM_BASE, ...icoNames('simbolo').filter(n => !SYM_BASE.includes(n)).sort((a, b) => a.localeCompare(b, 'it'))];
const clsColor = cl => { const o = icoGet('classe', cl); return (o && o.color) || (CLASS_VAR[cl] ? 'var(' + CLASS_VAR[cl] + ')' : 'var(--muted)'); };
const inkOf = cl => {
  const o = icoGet('classe', cl);
  if (o && /^#[0-9a-f]{6}$/i.test(o.color || '')) { const h = o.color.slice(1), r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16); return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#161616' : '#ffffff'; }
  return CLASS_INK[cl] || '#ffffff';
};
const rarColor = r => { const o = icoGet('rarita', r); return (o && o.color) || (RAR_VAR[r] ? 'var(' + RAR_VAR[r] + ')' : '#888888'); };
const rdot = r => { const o = icoGet('rarita', r); return o && o.data ? `<img class="rimg" src="${esc(o.data)}" alt="">` : `<i class="rdot" style="--rc:${rarColor(r)}"></i>`; };
const affIcon = (a, cls) => { const o = icoGet('affiliazione', a); return o && o.data ? `<img class="aff ${cls || ''}" src="${esc(o.data)}" alt="">` : ''; };
const classIcon = (cl, cls = '', color) => {
  const o = icoGet('classe', cl);
  if (o && o.data) return `<img class="ci ${cls}" src="${esc(o.data)}" alt="">`;
  if (CLASS_ICON[cl]) return `<svg class="ci ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${color || clsColor(cl)}" aria-hidden="true">${CLASS_ICON[cl]}</svg>`;
  return cls ? '' : `<i class="dot" style="--cc:${clsColor(cl)}"></i>`;
};
const abBase = x => String(x).replace(/\s*\(.*\)\s*$/, '').replace(/\s+[\d.]+\s*$/, '').trim();

const AFF_VER = 1;

function runAffReset() {

  const todo = allCards().filter(c => c.affiliazioni.length && fix(c).join('|') !== c.affiliazioni.join('|'));
  todo.forEach(c => { c.affiliazioni = fix(c); c.affiliazione = c.affiliazioni[0] || ''; S.cards[c.id] = c; });
  if (DB) todo.forEach(c => chain('c/' + c.id, () => DB.collection('cards').doc(c.id).update({affiliazioni: c.affiliazioni, affiliazione: c.affiliazione})).catch(dbErr));
  Object.values(ICONS).filter(o => o.kind === 'affiliazione').forEach(o => {
    const m = map[canon(o.name)];
    if (!m) delIcon('affiliazione', o.name);
    else if (m !== o.name) { const keep = {data: o.data || '', color: o.color || '', custom: false}; delIcon('affiliazione', o.name); if (!icoGet('affiliazione', m)) putIcon('affiliazione', m, keep); }
  });

}

}

/* ---------- filtri ---------- */
function applyFilters(list, f = S.filters) {
  const q = norm(f.q.trim());
  let r = list.filter(c => {
    if (q && !(norm(c.nome).includes(q) || norm(c.sottonome).includes(q) || norm(c.code).includes(q) || (c.numero != null && q.replace(/^n°?\s*/, '') === String(c.numero)))) return false;
    if (f.set.size && !f.set.has(c.set)) return false;
    for (const k of ['tipo','classe','rarita']) if (f[k].size && !f[k].has(c[k])) return false;
    if (f.affiliazione.size && !c.affiliazioni.some(a => f.affiliazione.has(a))) return false;
    for (const [k] of STATS) {
      const [lo, hi] = f.range[k]; const v = c[k];
      if (lo === '' && hi === '') continue;
      if (v == null) return false;
      if (lo !== '' && v < Number(lo)) return false;
      if (hi !== '' && v > Number(hi)) return false;
    }
    if (f.estrazione === 'si' && !c.estrazione) return false;
    if (f.estrazione === 'no' && c.estrazione) return false;
    if (f.preferite === 'si' && !c.preferita) return false;
    if (f.stampa === 'si' && !inPrint(c)) return false;
    if (f.completa === 'si' && !c.completa) return false;
    if (f.completa === 'no' && c.completa) return false;
    if (f.caratteristiche.size) { const a = [...f.caratteristiche]; if (!(f.caMode === 'all' ? a.every(x => c.caratteristiche.includes(x)) : a.some(x => c.caratteristiche.includes(x)))) return false; }
    if (f.abilita.size) { const a = [...f.abilita]; if (!(f.abMode === 'all' ? a.every(x => c.abilita.some(y => abBase(y) === x)) : a.some(x => c.abilita.some(y => abBase(y) === x)))) return false; }
    return true;
  });
  const key = f.sort, dir = f.dir === 'desc' ? -1 : 1;
  r.sort((a, b) => {
    let x;
    if (key === 'nome') x = a.nome.localeCompare(b.nome, 'it');
    else if (key === 'code') x = nat(a.code, b.code);
    else if (key === 'set') x = (a.set ?? 99) - (b.set ?? 99);
    else if (key === 'numero') x = ((a.set ?? 99) - (b.set ?? 99)) || ((a.numero ?? 1e6) - (b.numero ?? 1e6));
    else if (key === 'added') x = (a.createdAt || 0) - (b.createdAt || 0);
    else if (key === 'tipo') x = TIPI.indexOf(a.tipo) - TIPI.indexOf(b.tipo);
    else if (key === 'classe') x = classi().indexOf(a.classe) - classi().indexOf(b.classe);
    else if (key === 'rarita') x = rarita().indexOf(a.rarita) - rarita().indexOf(b.rarita);
    else { const p = a[key], q2 = b[key]; if (p == null && q2 == null) x = 0; else if (p == null) return 1; else if (q2 == null) return -1; else x = p - q2; }
    return (x * dir) || nat(a.code, b.code);
  });
  return r;
}

const RULES_DEFAULT = {"sections": [{"id": "s1", "title": "Come si vince e come si perde", "summary": "Vince chi raggiunge per primo i punti gloria richiesti; si perde restando senza punti vita o senza carte da pescare.", "steps": [{"title": "Vincere", "body": "Guadagni i **punti gloria** richiesti per vincere. Il numero da raggiungere dipende da quanti giocatori siete (vedi Preparazione)."}, {"title": "Perdere", "body": "Perdi la partita se:\n- perdi tutti i tuoi **punti vita**;\n- non puoi più **pescare** dal tuo mazzo giocatore."}]}, {"id": "s2", "title": "Preparazione", "summary": "Ogni giocatore parte con dei punti vita e un obiettivo di gloria che dipendono da quanti giocatori siete.", "steps": [{"title": "Conta i giocatori", "body": "Si gioca da **2 a 6 giocatori**. Il numero di giocatori decide i punti vita di partenza e i punti gloria necessari per vincere."}, {"title": "Punti vita iniziali", "body": "- **2 giocatori:** 20 punti vita\n- **3 giocatori:** 25 punti vita\n- **4 giocatori:** 30 punti vita\n- **5 giocatori:** 35 punti vita\n- **6 giocatori:** 40 punti vita"}, {"title": "Punti gloria per vincere", "body": "- **2 giocatori:** 20 punti gloria\n- **3 giocatori:** 25 punti gloria\n- **4 giocatori:** 25 punti gloria\n- **5 giocatori:** 30 punti gloria\n- **6 giocatori:** 30 punti gloria"}]}, {"id": "s3", "title": "Il turno", "summary": "Ogni turno ha tre momenti: l’inizio, le azioni che puoi fare durante il turno e la fine.", "steps": [{"title": "Inizio del turno", "body": "Si attivano tutte le abilità delle carte dove c’è scritto **“All’inizio del turno”**."}, {"title": "Duellare", "body": "Un tuo personaggio si **esaurisce** per combattere contro un personaggio avversario esaurito.\n\nSe l’avversario non ha personaggi esauriti, il danno viene inflitto **direttamente al giocatore**."}, {"title": "Esaurire", "body": "Esaurisci un personaggio o un oggetto per eseguire una delle **mosse** scritte sulla carta."}, {"title": "Giocare carte", "body": "Per giocare una carta paghi il suo **costo in potere**."}, {"title": "Estrarre potere", "body": "Aggiungi **1 carta** al serbatoio del potere. Puoi farlo al massimo **una volta per turno**."}, {"title": "Fine del turno", "body": "- Si attivano tutte le abilità delle carte dove c’è scritto **“Alla fine del turno”**.\n- Tutti i personaggi attivi rimuovono **1 danno**."}]}, {"id": "s4", "title": "Le carte", "summary": "Ogni carta ha un tipo, un costo in potere, forza, resistenza, un’abilità speciale e delle mosse.", "steps": [{"title": "Tipi di carta", "body": "- Personaggi\n- Alleanza\n- Oggetto\n- Luogo\n- Fumetto"}, {"title": "Costo, forza e resistenza", "body": "- **Costo in potere:** quanto potere paghi per giocarla.\n- **Forza:** quanto è forte in duello.\n- **Resistenza:** quanto danno può sopportare."}, {"title": "Abilità speciale", "body": "Molte carte hanno un’**abilità speciale** che le rende uniche (vedi Abilità speciali)."}, {"title": "Le mosse", "body": "- **Mossa base:** c’è su tutte le carte ed **esaurisce** il personaggio.\n- **Mosse secondarie:** non si possono usare se il personaggio è esaurito."}, {"title": "Azioni ed effetti", "body": "- **Azioni:** si gioca la carta senza posizionarla sul tabellone e poi si scarta.\n- Alcuni effetti si attivano **“Quando viene giocato”**, **“Alla fine del turno”** o come **risposta**."}]}, {"id": "s5", "title": "Abilità speciali", "summary": "Le abilità speciali danno ai personaggi poteri particolari in difesa, in attacco e nel supporto.", "steps": [{"title": "Difesa", "body": "- **Protettore:** può entrare in gioco esaurito; se vieni attaccato, devono attaccare prima questo personaggio.\n- **Resistente:** il danno inflitto a questo personaggio è ridotto di TOT.\n- **Evasivo:** può essere attaccato solo da un altro personaggio con l’abilità Evasivo.\n- **Protetto:** gli avversari non possono selezionarlo se non per sfidarlo."}, {"title": "Attacco", "body": "- **Temerario:** non può essere esaurito, deve attaccare ogni t function layoutGame() {
  const el = $('#gm-pl'); if (!el || !G) return;
  const n = G.players.length, W = el.clientWidth, H = el.clientHeight, gap = 8;
  if (!W || !H) return;
  /* larghezza di un contatore (− cerchio +) con cerchio di diametro o */
  const oneW = o => o + 2 * Math.max(28, o * .4) + 2 * Math.max(4, o * .08);
  const fit = (cw, k) => { let lo = 0, hi = 260; for (let j = 0; j < 24; j++) { const m = (lo + hi) / 2; if (k * oneW(m) + (k - 1) * 20 + 24 <= cw) lo = m; else hi = m; } return lo; };
  let best = {o: -1};
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols), cw = (W - gap * (cols - 1)) / cols, ch = (H - gap * (rows - 1)) / rows, usable = ch - 62;
    for (const stack of [false, true]) {
      const ow = fit(cw, stack ? 1 : 2), hh = stack ? (usable - 6) / 2 : usable;
      const withLbl = Math.min(ow, hh / 1.25), noLbl = Math.min(ow, hh);
      const lbl = withLbl >= 56 || withLbl >= noLbl - 6, o = Math.min(160, lbl ? withLbl : noLbl);
      if (o > best.o + (stack ? 6 : .5)) best = {o, cols, rows, lbl, stack};
    }
  }
  el.style.gridTemplateColumns = `repeat(${best.cols}, minmax(0, 1fr))`;
  el.style.gridTemplateRows = `repeat(${best.rows}, minmax(0, 1fr))`;
  el.style.setProperty('--o', Math.max(24, Math.floor(best.o)) + 'px');
  el.classList.toggle('nolbl', !best.lbl); el.classList.toggle('stack', !!best.stack);
}

/* divide un PDF grande in più PDF validi più piccoli (ognuno sotto il limite di caricamento) */
async function splitPdf(file) {

  const src = await L.PDFDocument.load(await file.arrayBuffer(), {ignoreEncryption: true, updateMetadata: false});

}
async function uploadRulesPdf(file) {

  if (file.size > PDF_MAX) { toast('Il PDF è troppo grande: massimo 200 MB'); return; }
  S.pdfBusy = true; S.pdfBusyMsg = 'Carico il PDF…'; S.confirm = ''; renderAll();
  const old = S.rulesPdf, uploaded = [];
  try {
    if (S.mode === 'db') {
      if (!ASSETS) throw new Error('no-assets');
      let meta;
      if (file.size <= PART_MAX) {
        const u = await ASSETS.upload(file, {type: 'application/pdf'}); uploaded.push(u.id);
        meta = {id: u.id, name: file.name, size: file.size};
      } else {
        const parts = await splitPdf(file), out = [];
        for (let i = 0; i < parts.length; i++) {
          pdfMsg(`Carico il PDF… parte ${i + 1} di ${parts.length}`);
          const u = await ASSETS.upload(new Blob([parts[i].bytes], {type: 'application/pdf'}), {type: 'application/pdf'});
          uploaded.push(u.id); out.push({id: u.id, pages: parts[i].pages}); parts[i].bytes = null;
        }
        meta = {name: file.name, size: file.size, parts: out};
      }
      await DB.doc('meta/rulesPdf').set(meta);
      S.rulesPdf = meta;
      const keep = new Set(uploaded);
      pdfParts(old).forEach(x => { if (x.id && !keep.has(x.id)) ASSETS.delete(x.id).catch(() => {}); });
    } else {
      MEM_PDF = file; try { await idb.set('rulesPdf', file); } catch (e) { toast('Il PDF resta solo finché non chiudi la pagina'); }

    uploaded.forEach(id => ASSETS && ASSETS.delete(id).catch(() => {}));
    toast(e && e.message === 'page-too-big' ? 'Una pagina del PDF supera da sola 19 MB: non riesco a caricarla' : e && e.message === 'pdflib' ? 'Non riesco a preparare il PDF: controlla la connessione' : 'Caricamento non riuscito');

}

async function xiApply() {
  if (!XI || XI.busy) return;
  const {changes, created, rules} = XI, all = [...changes.map(x => x.card), ...created];
  all.forEach(c => { const n = normCard(c.id, c); S.cards[n.id] = n; });
  if (S.mode === 'db') all.forEach(c => chain('c/' + c.id, () => DB.collection('cards').doc(c.id).set(cleanCard(S.cards[c.id]))).catch(dbErr));
